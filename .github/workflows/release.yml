name: Release
on: 
  release:
    types: [published]

# used by the 4D-AIKit checkout below; without it the ref is empty and the
# default branch is silently used instead
env:
  DEPENDENCIES_BRANCH: main

jobs:
  create:
    name: "Create"
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
      - name: Check out 4D-AIKit
        uses: actions/checkout@v7
        with:
          repository: 4d/4D-AIKit
          path: Components/4D-AIKit.4dbase
          ref : ${{ env.DEPENDENCIES_BRANCH }}
          fetch-depth: 0
          lfs: true
      - name: BuildAndPackage
        id: build-package
        uses: 4d/build4d-action@main
        with:
          actions: "release"
          product-line: vcs
          version: vcs
          build: official
          token: ${{ secrets.DLTK }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}.zip"
          path: "build/${{ github.event.repository.name }}.zip"
          retention-days: 1
          if-no-files-found: error
      
  clear:
    needs: create
    if: failure()
    name: "Clear on failure"
    runs-on: ubuntu-latest
    permissions:
      contents: write # for release deletion
    steps:
      - name: 📄 Checkout repository
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: Remove release
        run: |
          echo "Build and package step failed. Checking for errors..."
          echo "Removing release"
          gh release delete ${{github.event.release.tag_name}} || echo "Release deletion failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
  publish:
    needs: create
    name: "Publish package"
    runs-on: ubuntu-latest
 
    permissions:
      contents: write # for asset upload
    steps:
      - name: 📄 Checkout repository
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: "${{ github.event.repository.name }}.zip"
          path: artifact
      - name: 📦 release package
        run: |
          gh release upload ${{github.event.release.tag_name}} "${{github.workspace}}/artifact/${{ github.event.repository.name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

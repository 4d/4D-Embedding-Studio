name: Build
on:
  push:
  pull_request:

env:
  DEPENDENCIES_BRANCH: main
  
jobs:
  build:
    name: "Build on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
  
    - name: Check out 4D-AIKit
      uses: actions/checkout@v6
      with:
        repository: 4d/4D-AIKit
        path: Components/4D-AIKit.4dbase
        ref : ${{ env.DEPENDENCIES_BRANCH }}
        fetch-depth: 0
        lfs: true

    - name: Build
      uses: 4d/build4d-action@main
      with:
        product-line: vcs
        version: vcs
        build: official
        token: ${{ secrets.DLTK }}
